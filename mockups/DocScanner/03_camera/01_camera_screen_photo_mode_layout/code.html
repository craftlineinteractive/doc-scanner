<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=390, height=844, initial-scale=1.0" name="viewport"/>
<title>Doc Scanner - Frame 5: Photo Mode (ID Photo Editor)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="w-[390px] h-[844px] bg-[#0c0e14] text-white flex flex-col justify-between overflow-hidden relative select-none mx-auto">
<!-- CAMERA VIEWPORT BACKGROUND -->
<div class="absolute inset-0 bg-[#12151f] flex flex-col justify-between z-0">
<!-- Camera Viewfinder Sim -->
<div class="absolute inset-0 bg-cover bg-center opacity-40" style="background-image: radial-gradient(circle at 50% 40%, #2a314b 0%, #0e111a 90%);"></div>
<!-- Top Bar -->
<div class="relative z-10 pt-11 px-4 pb-3 flex items-center justify-between w-full">
<button aria-label="Back" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 transition-colors">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button aria-label="Flash" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M3 3l18 18M13 10V3L4 14h7v7l2.5-3.5M17.5 10.5L20 7h-6.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button aria-label="Grid" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M3.75 6h16.5M3.75 12h16.5m-16.5 6h16.5M6 3.75v16.5M12 3.75v16.5m6-3.75v16.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button aria-label="Flip Camera" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5A4.5 4.5 0 0021 12v-1.5M16.5 3L21 7.5m0 0L16.5 12M21 7.5H7.5A4.5 4.5 0 003 12v1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button aria-label="Settings" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
<!-- Mode Selector Row -->
<!-- Bottom Controls Area -->
<div class="mt-auto flex flex-col z-10 w-full">
<!-- Mode Selector Tabs Row (Just Above Shutter) -->
<div class="w-full overflow-x-auto no-scrollbar py-2.5 px-4 mb-3 flex items-center justify-center space-x-6 text-[13px] font-medium tracking-wide select-none">
<button class="text-white/40 hover:text-white/70 whitespace-nowrap transition-colors">Document</button>
<button class="text-white/40 hover:text-white/70 whitespace-nowrap transition-colors">ID Card</button>
<button class="relative text-white font-semibold whitespace-nowrap flex flex-col items-center">
<span>Photo</span>
<div class="w-8 h-[2px] bg-[#4F46E5] rounded-full mt-1.5"></div>
</button>
<button class="text-white/40 hover:text-white/70 whitespace-nowrap transition-colors">Book</button>
<button class="text-white/40 hover:text-white/70 whitespace-nowrap transition-colors">Signature</button>
<button class="text-white/40 hover:text-white/70 whitespace-nowrap transition-colors">QR Scanner</button>
<button class="text-white/40 hover:text-white/70 whitespace-nowrap transition-colors">OCR Text</button>
</div>
<!-- Capture Row -->
<div class="pb-8 pt-1 px-8 flex items-center justify-between">
<!-- Left Quick Action / Placeholder -->
<div class="w-11 h-11 flex items-center justify-center">
<button aria-label="Batch Mode" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white/70 hover:bg-white/20 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
<!-- Center Shutter Button -->
<button aria-label="Take Photo" class="w-18 h-18 p-1.5 rounded-full border-2 border-white/60 flex items-center justify-center hover:border-white transition-all active:scale-95">
<div class="w-14 h-14 rounded-full bg-white transition-transform"></div>
</button>
<!-- Right Gallery Import Button -->
<div class="w-11 h-11 flex items-center justify-center">
<button aria-label="Open Gallery" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
</div>
</div>
<!-- 50% DARK OVERLAY -->
<div class="absolute inset-0 bg-black/60 z-20 backdrop-blur-[2px]"></div>
<!-- CENTERED WHITE DIALOG (20px rounded) -->
<div class="relative z-30 m-auto w-[350px] bg-white text-[#1E2340] rounded-[20px] p-5 shadow-2xl flex flex-col">
<!-- Header -->
<div class="mb-3">
<h2 class="text-[18px] font-bold text-[#1E2340] tracking-tight">ID Photo Editor</h2>
<p class="text-[13px] font-semibold text-[#4B5563] mt-0.5">Select photo size</p>
<p class="text-[11px] text-[#8A90A6] mt-0.5">Long press and drag to rearrange</p>
</div>
<!-- 2-Column Grid (6 Cards) -->
<div class="grid grid-cols-2 gap-2.5 my-2">
<!-- 1: 2 x 2 INCHES (Selected) -->
<div class="relative bg-[#EEF0FF] border-2 border-[#4F46E5] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
<span class="absolute top-1.5 right-1.5 text-[#4F46E5]/60 hover:text-[#4F46E5]">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div class="pr-3">
<p class="text-[11px] font-bold text-[#1E2340] leading-tight">2 x 2 INCHES</p>
<p class="text-[9px] font-semibold text-[#4F46E5] mt-0.5">DPI 600</p>
</div>
<div class="flex justify-end">
<svg class="w-4 h-4 text-[#4F46E5]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
<!-- 2: 35 x 45 MILLIMETERS -->
<div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
<span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div class="pr-3">
<p class="text-[11px] font-semibold text-[#1E2340] leading-tight">35 x 45 MM</p>
<p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 300</p>
</div>
<div class="flex justify-end">
<svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
<!-- 3: 2 x 2.5 CENTIMETERS -->
<div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
<span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div class="pr-3">
<p class="text-[11px] font-semibold text-[#1E2340] leading-tight">2 x 2.5 CM</p>
<p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 450</p>
</div>
<div class="flex justify-end">
<svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
<!-- 4: 600 x 600 PIXEL -->
<div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
<span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div class="pr-3">
<p class="text-[11px] font-semibold text-[#1E2340] leading-tight">600 x 600 PX</p>
<p class="text-[9px] text-[#8A90A6] mt-0.5">PIXEL</p>
</div>
<div class="flex justify-end">
<svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
<!-- 5: 51 x 51 MILLIMETERS -->
<div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
<span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div class="pr-3">
<p class="text-[11px] font-semibold text-[#1E2340] leading-tight">51 x 51 MM</p>
<p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 300</p>
</div>
<div class="flex justify-end">
<svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
<!-- 6: 25 x 35 MILLIMETERS -->
<div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
<span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div class="pr-3">
<p class="text-[11px] font-semibold text-[#1E2340] leading-tight">25 x 35 MM</p>
<p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 450</p>
</div>
<div class="flex justify-end">
<svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
</div>
<!-- Footer Buttons: Close (outline), Add New (indigo outline), Select (filled indigo) -->
<div class="flex items-center justify-end space-x-2 pt-3 mt-1 border-t border-gray-100">
<button class="px-3 py-2 text-xs font-semibold text-[#8A90A6] border border-gray-200 rounded-lg hover:bg-gray-50">Close</button>
<button class="px-3 py-2 text-xs font-semibold text-[#4F46E5] border border-[#4F46E5] rounded-lg hover:bg-indigo-50">Add New</button>
<button class="px-4 py-2 text-xs font-semibold text-white bg-[#4F46E5] rounded-lg shadow-sm hover:bg-indigo-600">Select</button>
</div>
</div>
</body>
</html>
